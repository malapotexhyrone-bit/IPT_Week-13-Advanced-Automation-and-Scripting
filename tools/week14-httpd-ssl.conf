Listen 8443

<VirtualHost *:8443>
    ServerName localhost:8443
    DocumentRoot "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/public"

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLCertificateFile "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/storage/https/server.crt"
    SSLCertificateKeyFile "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/storage/https/server.key"

    <Directory "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/public">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/storage/logs/week14-apache-error.log"
    CustomLog "C:/Users/Admin/Documents/IPT/IPT_Weeks-13-18_Student-Clearance-Workflow/backend/storage/logs/week14-apache-access.log" combined
</VirtualHost>
